name: software-engineering-coursework

x-sqlserver-healthcheck: &sqlserver-healthcheck
  test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Coursework_2026!}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    healthcheck: *sqlserver-healthcheck

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Coursework_2026!}"
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'coursework') IS NULL CREATE DATABASE coursework;
        ALTER DATABASE coursework SET COMPATIBILITY_LEVEL = 120;"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    profiles: ["container-app"]
    build: ./backend
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Coursework_2026%21}@sqlserver:1433/coursework?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
      CORS_ORIGINS: http://localhost:8080
      OSS_ENDPOINT: "${OSS_ENDPOINT:-https://oss-cn-hangzhou.aliyuncs.com}"
      OSS_BUCKET: "${OSS_BUCKET:-se-lab}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET}"
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  task-runner:
    profiles: ["container-app"]
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Coursework_2026%21}@sqlserver:1433/coursework?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    profiles: ["container-app"]
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Coursework_2026%21}@sqlserver:1433/coursework?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  frontend:
    profiles: ["container-app"]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  test-sqlserver:
    profiles: ["test"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Coursework_2026!}"
    volumes:
      - /var/opt/mssql
    healthcheck: *sqlserver-healthcheck
    networks: [test]

  test-sqlserver-init:
    profiles: ["test"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Coursework_2026!}"
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S test-sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'coursework_test') IS NULL CREATE DATABASE coursework_test;
        ALTER DATABASE coursework_test SET COMPATIBILITY_LEVEL = 120;"
    depends_on:
      test-sqlserver:
        condition: service_healthy
    networks: [test]

  test-migrate:
    profiles: ["test"]
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Coursework_2026%21}@test-sqlserver:1433/coursework_test?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
    depends_on:
      test-sqlserver-init:
        condition: service_completed_successfully
    networks: [test]

  test-api:
    profiles: ["test"]
    build: ./backend
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Coursework_2026%21}@test-sqlserver:1433/coursework_test?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
      CORS_ORIGINS: http://test-frontend
      OSS_ENDPOINT: "${OSS_ENDPOINT:-https://oss-cn-hangzhou.aliyuncs.com}"
      OSS_BUCKET: "${OSS_BUCKET:-se-lab}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET}"
      OSS_KEY_PREFIX: "test/"
    depends_on:
      test-migrate:
        condition: service_completed_successfully
    networks:
      test:
        aliases:
          - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  test-frontend:
    profiles: ["test"]
    build: ./frontend
    depends_on:
      test-api:
        condition: service_healthy
    networks: [test]

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://test-frontend
    volumes:
      - ./frontend/test-results:/app/test-results
    depends_on:
      test-frontend:
        condition: service_healthy
    ipc: host
    networks: [test]

volumes:
  sqlserver_data:

networks:
  test:
